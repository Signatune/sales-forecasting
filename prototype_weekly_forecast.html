<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Weekly bagel forecast</title>
<style>
:root {
  color-scheme: light;
  --page:        #f9f9f7;
  --surface-1:   #fcfcfb;
  --ink:         #0b0b0b;
  --ink-2:       #52514e;
  --muted:       #898781;
  --grid:        #e1e0d9;
  --axis:        #c3c2b7;
  --border:      rgba(11,11,11,.10);
  --series-1:    #2a78d6;
  --series-2:    #eb6834;
  --series-3:    #1baf7a;
  --ghost:       #c3c2b7;
  --up:          #006300;
  --down:        #d03b3b;
  --wash:        rgba(11,11,11,.04);
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface-1: #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --axis:      #383835;
    --border:    rgba(255,255,255,.10);
    --series-1:  #3987e5;
    --series-2:  #d95926;
    --series-3:  #199e70;
    --ghost:     #4a4a46;
    --up:        #0ca30c;
    --down:      #e66767;
    --wash:      rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:      #0d0d0d;
  --surface-1: #1a1a19;
  --ink:       #ffffff;
  --ink-2:     #c3c2b7;
  --muted:     #898781;
  --grid:      #2c2c2a;
  --axis:      #383835;
  --border:    rgba(255,255,255,.10);
  --series-1:  #3987e5;
  --series-2:  #d95926;
  --series-3:  #199e70;
  --ghost:     #4a4a46;
  --up:        #0ca30c;
  --down:      #e66767;
  --wash:      rgba(255,255,255,.05);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#root { max-width: 1180px; margin: 0 auto; padding: 32px 24px 140px; }

/* --- prototype banner: this is not part of any design being judged --- */
.proto-note {
  font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--border);
  padding-bottom: 10px; margin-bottom: 28px; display: flex;
  justify-content: space-between; gap: 16px; flex-wrap: wrap;
}

h1 { font-size: 25px; letter-spacing: -.02em; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 14px; font-weight: 620; letter-spacing: -.01em; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0; }
.muted { color: var(--muted); }

.delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 600;
         font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up   { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat, .delta.unknown { color: var(--ink-2); }
.delta .arrow { font-size: .95em; }

.prov {
  font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
  font-weight: 650; padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
}
.prov.extended { border-style: dashed; }

/* ===================== A — bake board ===================== */
.A-hero {
  display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap;
  padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--border);
}
.A-hero .fig { font-size: 56px; font-weight: 680; letter-spacing: -.03em; line-height: 1; }
.A-hero .cap { color: var(--ink-2); font-size: 13.5px; }
.A-board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.A-day {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 10px;
}
.A-day.weekend { background: var(--wash); }
.A-day .dow { font-weight: 640; font-size: 13.5px; }
.A-day .date { color: var(--muted); font-size: 11.5px; }
.A-day .qty { font-size: 30px; font-weight: 660; letter-spacing: -.025em; line-height: 1; }
.A-day .unit { font-size: 11.5px; color: var(--muted); }
.A-split { display: flex; gap: 2px; height: 6px; }
.A-split i { display: block; border-radius: 3px; }
.A-legend-row { display: flex; justify-content: space-between; font-size: 11.5px;
                color: var(--ink-2); font-variant-numeric: tabular-nums; }
.A-legend-row .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block;
                    margin-right: 5px; vertical-align: -1px; }
@media (max-width: 900px) { .A-board { grid-template-columns: repeat(2, 1fr); } }

/* ===================== B — Friday briefing ===================== */
.B-wrap { max-width: 760px; }
.B-lead { font-size: 19px; line-height: 1.55; letter-spacing: -.01em; margin: 20px 0 30px; }
.B-lead b { font-weight: 660; }
.B-rows { border-top: 1px solid var(--border); }
.B-row {
  display: grid; grid-template-columns: 96px 1fr 74px 96px; gap: 16px;
  align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border);
}
.B-row .dow { font-weight: 600; }
.B-row .dow small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.B-bar { position: relative; height: 15px; }
.B-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1);
               border-radius: 0 4px 4px 0; }
.B-bar .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ghost); }
.B-row .qty { text-align: right; font-weight: 640; font-variant-numeric: tabular-nums; font-size: 17px; }
.B-row .mv { text-align: right; font-size: 13.5px; }
.B-notes { margin-top: 30px; }
.B-notes li { margin-bottom: 9px; color: var(--ink-2); }
.B-notes b { color: var(--ink); font-weight: 620; }

/* ===================== C — chart-first ===================== */
.C-head { display: flex; justify-content: space-between; align-items: flex-end;
          gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: block; }
.C-chart { background: var(--surface-1); border: 1px solid var(--border);
           border-radius: 12px; padding: 18px 18px 8px; position: relative; }
.C-small { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.C-card { background: var(--surface-1); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px 14px 6px; }
.C-card h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 620; display: flex;
             align-items: center; gap: 7px; }
.C-card h3 i { width: 9px; height: 9px; border-radius: 2px; }
.C-card .tot { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .C-small { grid-template-columns: 1fr; } }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 11px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.14);
  min-width: 150px; z-index: 5;
}
.tip .t { font-weight: 640; margin-bottom: 5px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px;
          font-variant-numeric: tabular-nums; color: var(--ink-2); }
.tip .r b { color: var(--ink); font-weight: 600; }
.tbl-toggle {
  font: inherit; font-size: 12.5px; color: var(--ink-2); background: none;
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px; cursor: pointer;
}
.tbl-toggle:hover { background: var(--wash); }
table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px;
        font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px;
     text-transform: uppercase; letter-spacing: .04em; }
.scroll-x { overflow-x: auto; }

.footnote { margin-top: 26px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

/* ===================== the switcher (not part of the design) ===================== */
#switcher {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; z-index: 100;
  background: #111; color: #fff; border-radius: 999px; padding: 5px;
  box-shadow: 0 8px 30px rgba(0,0,0,.35); font-size: 13px;
}
#switcher button {
  background: none; border: 0; color: #fff; font: inherit; cursor: pointer;
  padding: 7px 12px; border-radius: 999px; line-height: 1;
}
#switcher button:hover { background: rgba(255,255,255,.16); }
#switcher .lbl { padding: 0 12px; white-space: nowrap; font-weight: 600; }
#switcher .lbl em { font-style: normal; opacity: .62; font-weight: 400; }
</style>
</head>
<body>
<div id="root"></div>
<div id="switcher"></div>

<script>
const DATA = __PAYLOAD__;

const n0 = v => v == null ? "—" : Math.round(v).toLocaleString();
const pct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
const ARROW = { up: "↑", down: "↓", flat: "→", unknown: "·" };
const WORD  = { up: "up", down: "down", flat: "flat", unknown: "no baseline" };
const VARS  = ["plain", "sesame", "everything"];
const VCOLOR = { plain: "var(--series-1)", sesame: "var(--series-2)", everything: "var(--series-3)" };

// Direction is always spelled with an arrow glyph AND a number, so it never
// rests on colour alone.
const delta = d =>
  `<span class="delta ${d.direction}"><span class="arrow">${ARROW[d.direction]}</span>${
    d.delta_pct == null ? "no baseline" : pct(d.delta_pct)}</span>`;

const provTag = p =>
  `<span class="prov ${p}">${p === "logged" ? "logged" : "extrapolated"}</span>`;

const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ============================ VARIANT A ============================
   "Bake board" — seven columns, one per day, read left to right. The whole
   week is on screen at once at equal weight; the primary affordance is
   scanning across for the day you're baking for. */
function VariantA() {
  const w = DATA.week;
  const days = DATA.days.map(d => {
    const split = VARS.map(v => d.varieties[v] || 0);
    const tot = split.reduce((a, b) => a + b, 0) || 1;
    return `
      <div class="A-day${["Sat","Sun"].includes(d.short) ? " weekend" : ""}">
        <div>
          <div class="dow">${d.weekday}</div>
          <div class="date">${d.label}</div>
        </div>
        <div>
          <div class="qty">${n0(d.forecast)}</div>
          <div class="unit">bagels</div>
        </div>
        <div>${delta(d)}<div class="date">vs ${d.baseline_label} · ${n0(d.actual)}</div></div>
        <div class="A-split">
          ${split.map((s, i) => `<i style="flex:${s};background:${VCOLOR[VARS[i]]}"></i>`).join("")}
        </div>
        ${VARS.map((v, i) => `
          <div class="A-legend-row">
            <span><i class="sw" style="background:${VCOLOR[v]}"></i>${v}</span>
            <span>${n0(d.varieties[v])}</span>
          </div>`).join("")}
        <div>${provTag(d.provenance)}</div>
      </div>`;
  }).join("");

  return `
    <h1>Bake board — ${w.label}</h1>
    <p class="sub">Forecast Wheat Dough bagels per day, against the same weekday of ${w.baseline_label}.</p>
    <div class="A-hero">
      <div>
        <div class="fig">${n0(w.forecast)}</div>
        <div class="cap">bagels forecast for the week</div>
      </div>
      <div>
        <div style="font-size:19px">${delta(w)}</div>
        <div class="cap">vs ${n0(w.actual)} sold ${w.baseline_label}</div>
      </div>
    </div>
    <div class="A-board">${days}</div>
    ${footnote()}`;
}

/* ============================ VARIANT B ============================
   "Friday briefing" — no cards, no grid. A document: a sentence that states
   the week's answer, a single aligned list you read top to bottom, then the
   exceptions called out by name. The primary affordance is reading, not
   scanning. */
function VariantB() {
  const w = DATA.week;
  const max = Math.max(...DATA.days.map(d => Math.max(d.forecast || 0, d.actual || 0)));

  const rows = DATA.days.map(d => `
    <div class="B-row">
      <div class="dow">${d.weekday}<small>${d.label}</small></div>
      <div class="B-bar">
        <div class="fill" style="width:${(d.forecast || 0) / max * 100}%"></div>
        ${d.actual ? `<div class="ref" style="left:${d.actual / max * 100}%"></div>` : ""}
      </div>
      <div class="qty">${n0(d.forecast)}</div>
      <div class="mv">${delta(d)}</div>
    </div>`).join("");

  const movers = DATA.days
    .filter(d => d.direction === "up" || d.direction === "down")
    .sort((a, b) => Math.abs(b.delta_pct) - Math.abs(a.delta_pct));
  const extended = DATA.days.filter(d => d.provenance === "extended");

  const notes = movers.map(d => `
    <li><b>${d.weekday}</b> is ${WORD[d.direction]} ${pct(Math.abs(d.delta_pct)).replace("+","")}
        on ${d.baseline_label} — ${n0(d.forecast)} against ${n0(d.actual)} sold.</li>`).join("")
    || "<li>No day moves more than 3% on its counterpart last week.</li>";

  return `
    <div class="B-wrap">
      <h1>The week of ${w.label}</h1>
      <p class="sub">Wheat Dough bagels · ${DATA.model} · forecast as of ${DATA.as_of}</p>
      <p class="B-lead">
        Plan for <b>${n0(w.forecast)} bagels</b> across the week — ${WORD[w.direction]}
        ${w.delta_pct == null ? "" : `<b>${pct(w.delta_pct)}</b>`} on the
        ${n0(w.actual)} sold the week of ${w.baseline_label}.
        The weekend carries ${Math.round(
          (DATA.days.slice(5).reduce((a, d) => a + (d.forecast || 0), 0)) / w.forecast * 100)}%
        of it, as it usually does.
      </p>
      <div class="B-rows">
        <div class="B-row" style="border-bottom-color:var(--axis)">
          <div class="muted" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.04em">Day</div>
          <div class="muted" style="font-size:11.5px">
            forecast <span style="color:var(--ghost)">│</span> last week
          </div>
          <div class="qty muted" style="font-size:11.5px">Bagels</div>
          <div class="mv muted" style="font-size:11.5px">Move</div>
        </div>
        ${rows}
      </div>
      <div class="B-notes">
        <h2>What moved</h2>
        <ul>${notes}</ul>
        ${extended.length ? `
          <h2 style="margin-top:22px">What is not yet logged</h2>
          <ul><li>${extended.map(d => d.weekday).join(" and ")}
            ${extended.length > 1 ? "are" : "is"} past the ${DATA.as_of} run's 7-day horizon.
            Those numbers were extrapolated from the same models just now, not read from
            the forecast log, and will be replaced by logged runs as the week gets closer.</li></ul>` : ""}
      </div>
      ${footnote()}
    </div>`;
}

/* ============================ VARIANT C ============================
   "Chart-first" — one large plot carries the whole answer; everything else is
   subordinate to it. Forecast bars against last week's actuals as a recessive
   reference, then per-variety small multiples, then a table view. */
function VariantC() {
  const w = DATA.week;
  return `
    <div class="C-head">
      <div>
        <h1>Bagel demand — ${w.label}</h1>
        <p class="sub">Forecast against the same weekday of ${w.baseline_label} ·
          <span class="delta ${w.direction}"><span class="arrow">${ARROW[w.direction]}</span>${
            pct(w.delta_pct)} on the week</span></p>
      </div>
      <div class="legend">
        <span><i style="background:var(--series-1)"></i>Forecast</span>
        <span><i style="background:var(--ghost)"></i>Sold last week</span>
      </div>
    </div>
    <div class="C-chart">${mainChart()}<div class="tip" id="tip"></div></div>
    <div class="C-small">${VARS.map(smallMultiple).join("")}</div>
    <div style="margin-top:16px">
      <button class="tbl-toggle" id="tbl-btn">Show the numbers</button>
      <div id="tbl" hidden>${table()}</div>
    </div>
    ${footnote()}`;
}

function mainChart() {
  const W = 1100, H = 340, P = { t: 18, r: 14, b: 42, l: 46 };
  const max = Math.max(...DATA.days.map(d => Math.max(d.forecast || 0, d.actual || 0)));
  const top = Math.ceil(max / 100) * 100;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const band = iw / DATA.days.length;
  const y = v => P.t + ih - (v / top) * ih;

  const ticks = [0, .25, .5, .75, 1].map(f => {
    const v = top * f;
    return `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"
              stroke="${f === 0 ? "var(--axis)" : "var(--grid)"}" stroke-width="1"/>
            <text x="${P.l - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11"
              fill="var(--muted)">${v}</text>`;
  }).join("");

  const bars = DATA.days.map((d, i) => {
    const x = P.l + i * band;
    // Reference (last week) sits behind, inset and recessive; the forecast is
    // the foreground mark. 2px gaps between neighbouring fills.
    const rw = band * .62, fw = band * .40;
    const rx = x + (band - rw) / 2, fx = x + (band - fw) / 2;
    const rh = Math.max(0, P.t + ih - y(d.actual || 0));
    const fh = Math.max(0, P.t + ih - y(d.forecast || 0));
    return `
      <g class="bar" data-i="${i}">
        <rect x="${rx}" y="${y(d.actual || 0)}" width="${rw}" height="${rh}"
              rx="4" fill="var(--ghost)" opacity=".45"/>
        <rect x="${fx}" y="${y(d.forecast || 0)}" width="${fw}" height="${fh}"
              rx="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>
        <text x="${x + band / 2}" y="${y(d.forecast || 0) - 9}" text-anchor="middle"
              font-size="12.5" font-weight="640" fill="var(--ink)">${n0(d.forecast)}</text>
        <text x="${x + band / 2}" y="${H - 22}" text-anchor="middle" font-size="12"
              fill="var(--ink-2)">${d.short}</text>
        <text x="${x + band / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5"
              fill="var(--muted)">${d.provenance === "extended" ? "extrapolated" : ""}</text>
        <rect x="${x}" y="${P.t}" width="${band}" height="${ih}" fill="transparent"/>
      </g>`;
  }).join("");

  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%"
            style="min-width:660px;display:block" id="main-svg">${ticks}${bars}</svg></div>`;
}

function smallMultiple(v) {
  const W = 320, H = 96, P = { t: 8, r: 6, b: 16, l: 6 };
  const vals = DATA.days.map(d => d.varieties[v] || 0);
  const refs = DATA.days.map(d => (d.varieties_actual || {})[v] || 0);
  const top = Math.max(...vals, ...refs) || 1;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const band = iw / 7;
  const total = vals.reduce((a, b) => a + b, 0);
  const refTotal = refs.reduce((a, b) => a + b, 0);
  const t = { direction: "unknown", delta_pct: null };
  if (refTotal > 0) {
    t.delta_pct = (total - refTotal) / refTotal * 100;
    t.direction = Math.abs(t.delta_pct) < 3 ? "flat" : (t.delta_pct > 0 ? "up" : "down");
  }

  const bars = DATA.days.map((d, i) => {
    const bw = band * .5, x = P.l + i * band + (band - bw) / 2;
    const h = (vals[i] / top) * ih;
    const rh = (refs[i] / top) * ih;
    return `
      <rect x="${x - 2}" y="${P.t + ih - rh}" width="${bw + 4}" height="${rh}" rx="3"
            fill="var(--ghost)" opacity=".38"/>
      <rect x="${x}" y="${P.t + ih - h}" width="${bw}" height="${h}" rx="3"
            fill="${VCOLOR[v]}" stroke="var(--surface-1)" stroke-width="2"/>
      <text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="9.5"
            fill="var(--muted)">${d.short[0]}</text>`;
  }).join("");

  return `
    <div class="C-card">
      <h3><i style="background:${VCOLOR[v]}"></i>${v}</h3>
      <div class="tot">${n0(total)} this week · ${delta(t)}</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px">${bars}</svg>
    </div>`;
}

function table() {
  const rows = DATA.days.map(d => `
    <tr>
      <td>${d.weekday} <span class="muted">${d.label}</span></td>
      <td>${n0(d.forecast)}</td>
      ${VARS.map(v => `<td>${n0(d.varieties[v])}</td>`).join("")}
      <td>${n0(d.actual)}</td>
      <td>${delta(d)}</td>
      <td style="text-align:left">${provTag(d.provenance)}</td>
    </tr>`).join("");
  return `<div class="scroll-x"><table>
    <thead><tr><th>Day</th><th>Forecast</th>
      ${VARS.map(v => `<th>${v}</th>`).join("")}
      <th>Last week</th><th>Move</th><th>Source</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><th>Week</th><th>${n0(DATA.week.forecast)}</th>
      ${VARS.map(v => `<th>${n0(DATA.days.reduce((a, d) => a + (d.varieties[v] || 0), 0))}</th>`).join("")}
      <th>${n0(DATA.week.actual)}</th><th>${delta(DATA.week)}</th><th></th></tr></tfoot>
  </table></div>`;
}

function footnote() {
  const src = DATA.source === "database"
    ? `Real Sales and the real <code>forecasts</code> log, config version ${DATA.config_version},
       model <b>${esc(DATA.model)}</b>, as of ${DATA.as_of}. Days marked
       <i>extrapolated</i> are past that run's 7-day horizon and were produced by
       re-running the same models in memory.`
    : `<b>Fabricated data</b> — no database was reached. Shapes and magnitudes are
       plausible for the shop; the numbers are not real.`;
  return `<p class="footnote">${src}<br>
    The headline is the <code>wheat_bagels</code> Forecast Target, fit to the summed
    series top-down, so it will not equal the three varieties added up — those are
    forecast in their own right. Neither carries the Service Level buffer; this is
    the point forecast, not a Poolish quantity.<br>
    Generated ${DATA.generated_at}.</p>`;
}

/* ============================ switcher ============================ */
const VARIANTS = [
  ["A", "Bake board",      VariantA],
  ["B", "Friday briefing", VariantB],
  ["C", "Chart-first",     VariantC],
];

function current() {
  const k = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
  return VARIANTS.some(v => v[0] === k) ? k : "A";
}

// Prototype chrome, not part of the design: `?theme=dark|light` stamps the root
// so both palettes can be checked without touching the OS setting.
function setTheme(t) {
  const u = new URL(location.href);
  if (t) { u.searchParams.set("theme", t); document.documentElement.dataset.theme = t; }
  history.replaceState(null, "", u);
}
setTheme(new URLSearchParams(location.search).get("theme"));

function go(key) {
  const u = new URL(location.href);
  u.searchParams.set("variant", key);
  history.replaceState(null, "", u);
  render();
}

function cycle(step) {
  const i = VARIANTS.findIndex(v => v[0] === current());
  go(VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length][0]);
}

function render() {
  const key = current();
  const [, name, fn] = VARIANTS.find(v => v[0] === key);
  document.title = `PROTOTYPE ${key} — ${name}`;
  document.getElementById("root").innerHTML = `
    <div class="proto-note">
      <span>Prototype — throwaway. Variant ${key}: ${name}</span>
      <span>${DATA.source === "database" ? "live data" : "fabricated data"}</span>
    </div>` + fn();

  document.getElementById("switcher").innerHTML = `
    <button id="prev" aria-label="Previous variant">&#8592;</button>
    <span class="lbl">${key} <em>— ${name}</em></span>
    <button id="next" aria-label="Next variant">&#8594;</button>
    <button id="theme" aria-label="Toggle light/dark" title="Light / dark">◐</button>`;
  document.getElementById("prev").onclick = () => cycle(-1);
  document.getElementById("next").onclick = () => cycle(1);
  document.getElementById("theme").onclick = () => {
    const dark = document.documentElement.dataset.theme !== "dark";
    setTheme(dark ? "dark" : "light");
  };

  if (key === "C") wireChart();
  window.scrollTo(0, 0);
}

function wireChart() {
  const btn = document.getElementById("tbl-btn");
  btn.onclick = () => {
    const t = document.getElementById("tbl");
    t.hidden = !t.hidden;
    btn.textContent = t.hidden ? "Show the numbers" : "Hide the numbers";
  };

  const svg = document.getElementById("main-svg");
  const tip = document.getElementById("tip");
  const box = svg.closest(".C-chart");
  svg.querySelectorAll("g.bar").forEach(g => {
    g.style.cursor = "default";
    g.addEventListener("mousemove", e => {
      const d = DATA.days[+g.dataset.i];
      tip.innerHTML = `
        <div class="t">${d.weekday} ${d.label}</div>
        <div class="r"><span>Forecast</span><b>${n0(d.forecast)}</b></div>
        <div class="r"><span>${d.baseline_label}</span><b>${n0(d.actual)}</b></div>
        <div class="r"><span>Move</span>${delta(d)}</div>
        ${VARS.map(v => `<div class="r"><span>${v}</span><b>${n0(d.varieties[v])}</b></div>`).join("")}
        <div class="r" style="margin-top:5px">${provTag(d.provenance)}</div>`;
      const r = box.getBoundingClientRect();
      tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 190) + "px";
      tip.style.top = (e.clientY - r.top + 14) + "px";
    });
    g.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
  });
}

addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

render();
</script>
</body>
</html>
